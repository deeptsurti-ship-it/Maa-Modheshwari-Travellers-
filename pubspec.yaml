name: travel_bill
description: Invoice Generator App for Maa Modheshwari Travels
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^2.30.0
  cloud_firestore: ^4.15.0
  intl: ^0.19.0
  pdf: ^3.10.6
  path_provider: ^2.1.2
  open_file: ^3.3.2
  permission_handler: ^11.3.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpeg
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
